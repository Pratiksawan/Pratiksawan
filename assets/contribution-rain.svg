<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 292" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Contribution stream — decorative digital rain</title>
  <desc id="desc">A dense, looping field of neon-green pixel trails with a simulated System Online indicator. This artwork does not represent commit counts.</desc>
  <style>
    text{font-family:'Fira Code','Courier New',monospace}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes blink{0%,48%{opacity:1}52%,100%{opacity:0}}
    .online{animation:pulse 3s ease-in-out infinite}
    .cursor{animation:blink 1.6s steps(1,end) infinite}
    .still{display:none}
    @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}*{animation:none!important}}
  </style>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="8" height="8" rx="1" fill="#003B00" opacity=".65"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00FF41" opacity=".035"/>
    </pattern>
    <linearGradient id="line"><stop stop-color="#00FF41" stop-opacity="0"/><stop offset=".5" stop-color="#00FF41"/><stop offset="1" stop-color="#00FF41" stop-opacity="0"/></linearGradient>
    <clipPath id="stream-clip"><rect x="32" y="73" width="896" height="154" rx="4"/></clipPath>
    <g id="trail">
      <rect y="0" width="8" height="8" rx="1" fill="#D9FFE3"/>
      <rect y="-18" width="8" height="8" rx="1" fill="#00FF41"/>
      <rect y="-36" width="8" height="8" rx="1" fill="#00FF41" opacity=".8"/>
      <rect y="-54" width="8" height="8" rx="1" fill="#00FF41" opacity=".6"/>
      <rect y="-72" width="8" height="8" rx="1" fill="#00FF41" opacity=".4"/>
      <rect y="-90" width="8" height="8" rx="1" fill="#00FF41" opacity=".25"/>
      <rect y="-108" width="8" height="8" rx="1" fill="#00FF41" opacity=".12"/>
    </g>
    <g id="strip">
      <g transform="translate(0 24)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="0 -100;0 330" dur="9s" begin="-2s" repeatCount="indefinite"/></g>
      <g transform="translate(18 110)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="18 -100;18 330" dur="12s" begin="-7s" repeatCount="indefinite"/></g>
      <g transform="translate(36 60)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="36 -100;36 330" dur="8s" begin="-4s" repeatCount="indefinite"/></g>
      <g transform="translate(54 145)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="54 -100;54 330" dur="11s" begin="-6s" repeatCount="indefinite"/></g>
      <g transform="translate(72 88)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="72 -100;72 330" dur="10s" begin="-3s" repeatCount="indefinite"/></g>
      <g transform="translate(90 38)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="90 -100;90 330" dur="13s" begin="-9s" repeatCount="indefinite"/></g>
      <g transform="translate(108 175)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="108 -100;108 330" dur="9s" begin="-5s" repeatCount="indefinite"/></g>
      <g transform="translate(126 75)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="126 -100;126 330" dur="14s" begin="-8s" repeatCount="indefinite"/></g>
      <g transform="translate(144 130)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="144 -100;144 330" dur="8s" begin="-1s" repeatCount="indefinite"/></g>
      <g transform="translate(162 55)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="162 -100;162 330" dur="12s" begin="-5s" repeatCount="indefinite"/></g>
      <g transform="translate(180 165)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="180 -100;180 330" dur="10s" begin="-7s" repeatCount="indefinite"/></g>
      <g transform="translate(198 98)"><use href="#trail"/><animateTransform attributeName="transform" type="translate" values="198 -100;198 330" dur="11s" begin="-3s" repeatCount="indefinite"/></g>
    </g>
  </defs>
  <rect x="1" y="1" width="958" height="290" rx="8" fill="#0D1117" stroke="#003B00"/>
  <rect width="960" height="292" fill="url(#scan)"/>
  <text x="32" y="40" fill="#00FF41" font-size="18" font-weight="bold">// CONTRIBUTION STREAM</text>
  <rect class="cursor" x="284" y="28" width="9" height="14" fill="#00FF41"/>
  <circle class="online" cx="790" cy="34" r="4" fill="#00FF41" filter="url(#glow)"/>
  <text x="810" y="38" fill="#00FF41" font-size="11" letter-spacing="1">SYSTEM ONLINE</text>
  <path d="M32 57H928" stroke="#003B00"/>
  <rect x="32" y="73" width="896" height="154" rx="4" fill="url(#grid)"/>
  <g class="motion" clip-path="url(#stream-clip)" filter="url(#glow)">
    <use href="#strip" x="34" y="74"/>
    <use href="#strip" x="250" y="56"/>
    <use href="#strip" x="466" y="92"/>
    <use href="#strip" x="682" y="65"/>
    <path d="M32 75H928" stroke="#00FF41" opacity=".2" stroke-width=".7">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 150" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
  <g class="still" clip-path="url(#stream-clip)" fill="#00FF41" opacity=".7">
    <rect x="80" y="95" width="8" height="80"/><rect x="242" y="131" width="8" height="60"/>
    <rect x="440" y="77" width="8" height="120"/><rect x="620" y="113" width="8" height="80"/>
    <rect x="854" y="95" width="8" height="100"/>
  </g>
  <text x="32" y="249" fill="#84A78E" font-size="10" letter-spacing="1">DECORATIVE DIGITAL RAIN / ARTWORK</text>
  <text x="928" y="249" text-anchor="end" fill="#84A78E" font-size="10">ACTUAL ACTIVITY: LINK BELOW</text>
  <path d="M32 273H405M555 273H928" stroke="url(#line)" stroke-width="1" filter="url(#glow)"/>
  <text x="480" y="277" text-anchor="middle" fill="#00FF41" font-size="12" letter-spacing="3">[ = = = = = ]</text>
</svg>
