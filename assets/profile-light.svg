<svg xmlns="http://www.w3.org/2000/svg" width="960" height="192" viewBox="0 0 960 192" role="img" aria-labelledby="title desc">
  <title id="title">Pratik Sawant — AI and Full Stack Engineer</title>
  <desc id="desc">A compact professional banner. The focus label cycles through backend services, AI integrations, and web applications.</desc>
  <rect x="1" y="1" width="958" height="190" rx="16" fill="#F5F8FC" stroke="#DCE5F0"/>
  <path d="M48 40H80" stroke="#2563B5" stroke-width="3" stroke-linecap="round"/>
  <text x="48" y="87" fill="#172B46" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="600" letter-spacing="-1">Pratik Sawant</text>
  <text x="48" y="121" fill="#52667F" font-family="Segoe UI,Arial,sans-serif" font-size="19">AI &amp; Full Stack Engineer</text>
  <text x="48" y="155" fill="#52667F" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1">NODE.JS  /  TYPESCRIPT  /  REACT</text>
  <rect x="615" y="30" width="313" height="132" rx="10" fill="#EAF1F9" />
  <text x="640" y="57" fill="#52667F" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">ENGINEERING FOCUS</text>
  <text x="640" y="97" fill="#172B46" font-family="Segoe UI,Arial,sans-serif" font-size="21" opacity="1">Backend services
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.61;0.66;0.94;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="640" y="97" fill="#172B46" font-family="Segoe UI,Arial,sans-serif" font-size="21" opacity="0">AI integrations
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="640" y="97" fill="#172B46" font-family="Segoe UI,Arial,sans-serif" font-size="21" opacity="0">Web applications
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.28;0.33;0.61;0.66;0.94;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <path d="M640 133H901" stroke="#D3E1F1" stroke-width="2" stroke-linecap="round"/>
  <rect x="640" y="132" width="62" height="2" rx="1" fill="#2563B5">
    <animate attributeName="x" values="640;839;640" dur="15s" repeatCount="indefinite"/>
  </rect>
</svg>
