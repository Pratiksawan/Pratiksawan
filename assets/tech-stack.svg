<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 74" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">Tech stack</title>
<desc id="desc">Node.js, TypeScript, React, Next.js, PostgreSQL, Redis, Prisma and Docker.</desc>
<style>text{font-family:'Fira Code','Courier New',monospace} .still{display:none} @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}*{animation:none!important}}</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="1" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00FF41" opacity=".12"/></pattern>
  <radialGradient id="vignette"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset=".65" stop-color="#000000" stop-opacity=".1"/><stop offset="1" stop-color="#000000" stop-opacity=".9"/></radialGradient>
</defs>
<rect width="960" height="74" rx="8" fill="#000000"/><rect x="22" y="20" width="98" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="71" y="41" text-anchor="middle" fill="#00FF41" font-size="13">Node.js</text><rect x="130" y="20" width="128" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="194" y="41" text-anchor="middle" fill="#00FF41" font-size="13">TypeScript</text><rect x="268" y="20" width="92" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="314" y="41" text-anchor="middle" fill="#00FF41" font-size="13">React</text><rect x="370" y="20" width="100" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="420" y="41" text-anchor="middle" fill="#00FF41" font-size="13">Next.js</text><rect x="480" y="20" width="142" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="551" y="41" text-anchor="middle" fill="#00FF41" font-size="13">PostgreSQL</text><rect x="632" y="20" width="90" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="677" y="41" text-anchor="middle" fill="#00FF41" font-size="13">Redis</text><rect x="732" y="20" width="98" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="781" y="41" text-anchor="middle" fill="#00FF41" font-size="13">Prisma</text><rect x="840" y="20" width="98" height="32" rx="4" fill="#001C08" stroke="#003B00"/><text x="889" y="41" text-anchor="middle" fill="#00FF41" font-size="13">Docker</text></svg>
