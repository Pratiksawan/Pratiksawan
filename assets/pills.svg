<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 195" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">Red pill and blue pill</title>
<desc id="desc">Original capsule illustrations. The red pill reads Take the red pill — become a developer. The blue pill reads Take the blue pill — stay in the Matrix.</desc>
<style>text{font-family:'Fira Code','Courier New',monospace} .still{display:none} @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}*{animation:none!important}}@keyframes redPulse{0%,100%{opacity:.35}50%{opacity:.8}}@keyframes bluePulse{0%,100%{opacity:.2}50%{opacity:.45}}.red-glow{animation:redPulse 5s ease-in-out infinite}.blue-glow{animation:bluePulse 7s ease-in-out infinite}</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="1" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00FF41" opacity=".12"/></pattern>
  <radialGradient id="vignette"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset=".65" stop-color="#000000" stop-opacity=".1"/><stop offset="1" stop-color="#000000" stop-opacity=".9"/></radialGradient>
</defs>
<defs><linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FF9696"/><stop offset=".33" stop-color="#FF2A2A"/><stop offset="1" stop-color="#730D0D"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9DB8FF"/><stop offset=".33" stop-color="#2A6BFF"/><stop offset="1" stop-color="#102458"/></linearGradient></defs>
<rect width="960" height="195" rx="8" fill="#000000"/><path d="M480 28V173" stroke="#003B00" stroke-dasharray="3 7"/>
<g transform="translate(240 78) rotate(-18)"><rect class="red-glow" x="-73" y="-24" width="146" height="48" rx="24" fill="#FF2A2A" filter="url(#soft-glow)"/><rect x="-64" y="-19" width="128" height="38" rx="19" fill="url(#red)" stroke="#FF2A2A"/><path d="M0 -18V18" stroke="#730D0D"/><path d="M-46 -10H-9" stroke="#FFD0D0" opacity=".65" stroke-width="3" stroke-linecap="round"/></g>
<g transform="translate(720 78) rotate(18)"><rect class="blue-glow" x="-73" y="-24" width="146" height="48" rx="24" fill="#2A6BFF" filter="url(#soft-glow)"/><rect x="-64" y="-19" width="128" height="38" rx="19" fill="url(#blue)" stroke="#2A6BFF"/><path d="M0 -18V18" stroke="#102458"/><path d="M-46 -10H-9" stroke="#D1DEFF" opacity=".65" stroke-width="3" stroke-linecap="round"/></g>
<text x="240" y="139" text-anchor="middle" fill="#FF2A2A" font-size="15" letter-spacing="1">TAKE THE RED PILL</text><text x="240" y="165" text-anchor="middle" fill="#A3DDB2" font-size="13">Become a developer.</text>
<text x="720" y="139" text-anchor="middle" fill="#2A6BFF" font-size="15" letter-spacing="1">TAKE THE BLUE PILL</text><text x="720" y="165" text-anchor="middle" fill="#8FAE97" font-size="13">Stay in the Matrix.</text><rect width="960" height="195" fill="url(#scanlines)" opacity=".45" pointer-events="none"/><rect width="960" height="195" filter="url(#grain)" opacity=".025" pointer-events="none"/>
</svg>
