<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 270" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">Terminal boot sequence</title>
<desc id="desc">Five cinematic terminal lines appear in sequence, ending in System Resurrection Complete. Reduced-motion viewers see the complete text.</desc>
<style>text{font-family:'Fira Code','Courier New',monospace} .still{display:none} @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}*{animation:none!important}}@keyframes blink{0%,48%{opacity:1}52%,100%{opacity:0}}@keyframes screen{0%,100%{opacity:1}50%{opacity:.97}}.cursor{animation:blink 1.6s steps(1,end) infinite}.screen{animation:screen 12s ease-in-out infinite}</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="1" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00FF41" opacity=".12"/></pattern>
  <radialGradient id="vignette"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset=".65" stop-color="#000000" stop-opacity=".1"/><stop offset="1" stop-color="#000000" stop-opacity=".9"/></radialGradient>
</defs>
<rect x="1" y="1" width="958" height="268" rx="8" fill="#000000" stroke="#003B00"/><path d="M1 45H959" stroke="#003B00"/><circle cx="27" cy="24" r="3" fill="#00FF41"/><circle cx="41" cy="24" r="3" fill="#003B00"/><circle cx="55" cy="24" r="3" fill="#003B00"/><text x="80" y="28" fill="#8FAE97" font-size="12">pratiksawan@github:~ / resurrection.log</text><text x="918" y="28" text-anchor="end" fill="#00FF41" font-size="10">REPLAY / 18s</text>
<defs><clipPath id="line-0"><rect x="30" y="66" width="850" height="29"><animate class="motion" attributeName="width" values="0;0;850;850;0" keyTimes="0;0.020;0.110;.94;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="line-1"><rect x="30" y="100" width="850" height="29"><animate class="motion" attributeName="width" values="0;0;850;850;0" keyTimes="0;0.155;0.245;.94;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="line-2"><rect x="30" y="134" width="850" height="29"><animate class="motion" attributeName="width" values="0;0;850;850;0" keyTimes="0;0.290;0.380;.94;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="line-3"><rect x="30" y="168" width="850" height="29"><animate class="motion" attributeName="width" values="0;0;850;850;0" keyTimes="0;0.425;0.515;.94;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="line-4"><rect x="30" y="202" width="850" height="29"><animate class="motion" attributeName="width" values="0;0;850;850;0" keyTimes="0;0.560;0.650;.94;1" calcMode="linear" dur="18s" repeatCount="indefinite"/></rect></clipPath></defs><g class="screen motion" font-size="17"><text x="34" y="86" clip-path="url(#line-0)" fill="#A3DDB2">&gt; Wake up, Neo...</text><text x="34" y="120" clip-path="url(#line-1)" fill="#A3DDB2">&gt; The Matrix has you...</text><text x="34" y="154" clip-path="url(#line-2)" fill="#A3DDB2">&gt; Follow the white rabbit.</text><text x="34" y="188" clip-path="url(#line-3)" fill="#A3DDB2">&gt; Knock, knock, Neo.</text><text x="34" y="222" clip-path="url(#line-4)" fill="#00FF41" filter="url(#glow)" font-weight="bold">&gt; SYSTEM RESURRECTION COMPLETE</text></g><g class="still" font-size="17"><text x="34" y="86" fill="#A3DDB2">&gt; Wake up, Neo...</text><text x="34" y="120" fill="#A3DDB2">&gt; The Matrix has you...</text><text x="34" y="154" fill="#A3DDB2">&gt; Follow the white rabbit.</text><text x="34" y="188" fill="#A3DDB2">&gt; Knock, knock, Neo.</text><text x="34" y="222" fill="#00FF41" font-weight="bold">&gt; SYSTEM RESURRECTION COMPLETE</text></g><rect class="cursor" x="34" y="239" width="9" height="3" fill="#00FF41"/><text x="918" y="246" text-anchor="end" fill="#548C63" font-size="10">CINEMATIC SEQUENCE · NO COMMANDS EXECUTED</text><rect width="960" height="270" fill="url(#scanlines)" opacity=".45" pointer-events="none"/><rect width="960" height="270" filter="url(#grain)" opacity=".025" pointer-events="none"/>
</svg>
